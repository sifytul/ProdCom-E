# NOTE: Do not commit real secrets to git. Use this as a template and apply
# via `kubectl create secret` or a secrets manager (e.g. Sealed Secrets,
# External Secrets Operator, AWS Secrets Manager) in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: ecom-secrets
  namespace: ecom
type: Opaque
stringData:
  POSTGRES_USER: ecom_user
  POSTGRES_PASSWORD: change_me_postgres_password
  POSTGRES_DB: ecom_db
  DATABASE_URL: postgres://ecom_user:change_me_postgres_password@postgres:5432/ecom_db
  REDIS_PASSWORD: change_me_redis_password
  REDIS_URL: redis://:change_me_redis_password@redis:6379
  JWT_SECRET: change_me_jwt_secret
